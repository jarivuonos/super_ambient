  <marker id="diamond" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="13" markerHeight="9" orient="auto-start-reverse"><path d="M1 5 L7 1 L13 5 L7 9 Z" fill="#333" stroke="#333"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<rect x="202" y="20" width="156" height="62" rx="6" fill="#ccccff" fill-opacity="1" stroke="#333" stroke-width="1"/>
<text x="280" y="47" font-size="11" text-anchor="middle" fill="#111">Clinician</text>
<text x="280" y="76" font-size="7.5" text-anchor="middle" fill="#555">«Stakeholder»</text>
<rect x="384" y="20" width="156" height="62" rx="6" fill="#ccccff" fill-opacity="1" stroke="#333" stroke-width="1"/>
<text x="462" y="40.5" font-size="11" text-anchor="middle" fill="#111">Application owner and</text>
<text x="462" y="53.5" font-size="11" text-anchor="middle" fill="#111">developer</text>
<text x="462" y="76" font-size="7.5" text-anchor="middle" fill="#555">«Stakeholder»</text>
<rect x="566" y="20" width="156" height="62" rx="6" fill="#ccccff" fill-opacity="1" stroke="#333" stroke-width="1"/>
<text x="644" y="40.5" font-size="11" text-anchor="middle" fill="#111">Employer IT (future</text>
<text x="644" y="53.5" font-size="11" text-anchor="middle" fill="#111">Azure tenant)</text>
<text x="644" y="76" font-size="7.5" text-anchor="middle" fill="#555">«Stakeholder»</text>
<rect x="748" y="20" width="156" height="62" rx="6" fill="#ccccff" fill-opacity="1" stroke="#333" stroke-width="1"/>
<text x="826" y="40.5" font-size="11" text-anchor="middle" fill="#111">Medical doctor (domain</text>
<text x="826" y="53.5" font-size="11" text-anchor="middle" fill="#111">reviewer)</text>
<text x="826" y="76" font-size="7.5" text-anchor="middle" fill="#555">«Stakeholder»</text>
<rect x="384" y="112" width="156" height="62" rx="6" fill="#ccccff" fill-opacity="1" stroke="#333" stroke-width="1"/>
<text x="462" y="126" font-size="11" text-anchor="middle" fill="#111">Documentation workload</text>
<text x="462" y="139" font-size="11" text-anchor="middle" fill="#111">and scattered patient</text>
<text x="462" y="152" font-size="11" text-anchor="middle" fill="#111">data</text>
<text x="462" y="168" font-size="7.5" text-anchor="middle" fill="#555">«Driver»</text>
<rect x="20" y="204" width="156" height="62" rx="6" fill="#ccccff" fill-opacity="1" stroke="#333" stroke-width="1"/>
<text x="98" y="218" font-size="11" text-anchor="middle" fill="#111">Patient and encounter</text>
<text x="98" y="231" font-size="11" text-anchor="middle" fill="#111">context enforced on</text>
<text x="98" y="244" font-size="11" text-anchor="middle" fill="#111">every read and write</text>
<text x="98" y="260" font-size="7.5" text-anchor="middle" fill="#555">«Requirement»</text>
<rect x="202" y="204" width="156" height="62" rx="6" fill="#ccccff" fill-opacity="1" stroke="#333" stroke-width="1"/>
<text x="280" y="224.5" font-size="11" text-anchor="middle" fill="#111">Understand the patient's</text>
<text x="280" y="237.5" font-size="11" text-anchor="middle" fill="#111">situation quickly</text>
<text x="280" y="260" font-size="7.5" text-anchor="middle" fill="#555">«Goal»</text>
<rect x="384" y="204" width="156" height="62" rx="6" fill="#ccccff" fill-opacity="1" stroke="#333" stroke-width="1"/>
<text x="462" y="224.5" font-size="11" text-anchor="middle" fill="#111">Document the</text>
<text x="462" y="237.5" font-size="11" text-anchor="middle" fill="#111">consultation smoothly</text>
<text x="462" y="260" font-size="7.5" text-anchor="middle" fill="#555">«Goal»</text>
<rect x="566" y="204" width="156" height="62" rx="6" fill="#ccccff" fill-opacity="1" stroke="#333" stroke-width="1"/>
<text x="644" y="218" font-size="11" text-anchor="middle" fill="#111">Show where smart</text>
<text x="644" y="231" font-size="11" text-anchor="middle" fill="#111">classification helps,</text>
<text x="644" y="244" font-size="11" text-anchor="middle" fill="#111">safely</text>
<text x="644" y="260" font-size="7.5" text-anchor="middle" fill="#555">«Goal»</text>
<rect x="748" y="204" width="156" height="62" rx="6" fill="#ccccff" fill-opacity="1" stroke="#333" stroke-width="1"/>
<text x="826" y="218" font-size="11" text-anchor="middle" fill="#111">Works without a model</text>
<text x="826" y="231" font-size="11" text-anchor="middle" fill="#111">service (visible mock</text>
<text x="826" y="244" font-size="11" text-anchor="middle" fill="#111">mode)</text>
<text x="826" y="260" font-size="7.5" text-anchor="middle" fill="#555">«Requirement»</text>
<rect x="20" y="296" width="156" height="62" rx="6" fill="#ccccff" fill-opacity="1" stroke="#333" stroke-width="1"/>
<text x="98" y="310" font-size="11" text-anchor="middle" fill="#111">Synthetic data only</text>
<text x="98" y="323" font-size="11" text-anchor="middle" fill="#111">(public, unauthenticated</text>
<text x="98" y="336" font-size="11" text-anchor="middle" fill="#111">test server)</text>
<text x="98" y="352" font-size="7.5" text-anchor="middle" fill="#555">«Constraint»</text>
<rect x="202" y="296" width="156" height="62" rx="6" fill="#ccccff" fill-opacity="1" stroke="#333" stroke-width="1"/>
<text x="280" y="316.5" font-size="11" text-anchor="middle" fill="#111">Answers and proposals</text>
<text x="280" y="329.5" font-size="11" text-anchor="middle" fill="#111">trace to a source</text>
<text x="280" y="352" font-size="7.5" text-anchor="middle" fill="#555">«Principle»</text>
<rect x="384" y="296" width="156" height="62" rx="6" fill="#ccccff" fill-opacity="1" stroke="#333" stroke-width="1"/>
<text x="462" y="316.5" font-size="11" text-anchor="middle" fill="#111">Human approval before</text>
<text x="462" y="329.5" font-size="11" text-anchor="middle" fill="#111">anything is saved</text>
<text x="462" y="352" font-size="7.5" text-anchor="middle" fill="#555">«Principle»</text>
<rect x="566" y="296" width="156" height="62" rx="6" fill="#ccccff" fill-opacity="1" stroke="#333" stroke-width="1"/>
<text x="644" y="316.5" font-size="11" text-anchor="middle" fill="#111">The application, not a</text>
<text x="644" y="329.5" font-size="11" text-anchor="middle" fill="#111">model, builds FHIR</text>
<text x="644" y="352" font-size="7.5" text-anchor="middle" fill="#555">«Principle»</text>
<rect x="748" y="296" width="156" height="62" rx="6" fill="#ccccff" fill-opacity="1" stroke="#333" stroke-width="1"/>
<text x="826" y="316.5" font-size="11" text-anchor="middle" fill="#111">Secrets and keys stay on</text>
<text x="826" y="329.5" font-size="11" text-anchor="middle" fill="#111">the server</text>
<text x="826" y="352" font-size="7.5" text-anchor="middle" fill="#555">«Principle»</text>
<rect x="748" y="388" width="156" height="62" rx="6" fill="#ccccff" fill-opacity="1" stroke="#333" stroke-width="1"/>
<text x="826" y="402" font-size="11" text-anchor="middle" fill="#111">Sending transcript text</text>
<text x="826" y="415" font-size="11" text-anchor="middle" fill="#111">to a third party is</text>
<text x="826" y="428" font-size="11" text-anchor="middle" fill="#111">opt-in</text>
<text x="826" y="444" font-size="7.5" text-anchor="middle" fill="#555">«Constraint»</text>
